<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b – Q2: Retrieve and Display JSON Data</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.5rem; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
    h2 { font-size: 1.05rem; margin: 0 0 6px; color: #2b4c7e; }
    #status { color: #666; font-style: italic; }
    .error { background: #fdecea; color: #b3261e; border: 1px solid #f5c2c0; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Book Information (from books.json)</h1>
  <p id="status">Loading book data…</p>
  <div id="output"></div>

  <script>
    // Optional ?src= lets us demonstrate the error handling (e.g. books.html?src=missing.json).
    const DATA_URL = new URLSearchParams(location.search).get("src") || "books.json";
    const output = document.getElementById("output");
    const status = document.getElementById("status");

    // Builds a <section> with a heading and one text line, using textContent only (no innerHTML).
    function addSection(heading, text) {
      const section = document.createElement("section");
      const h2 = document.createElement("h2");
      h2.textContent = heading;
      const p = document.createElement("p");
      p.textContent = text;
      section.append(h2, p);
      output.appendChild(section);
      return section;
    }

    function showError(message) {
      status.remove();
      output.replaceChildren();
      const box = document.createElement("p");
      box.className = "error";
      box.setAttribute("role", "alert");
      box.textContent = message;
      output.appendChild(box);
    }

    async function loadBooks() {
      let response;
      try {
        response = await fetch(DATA_URL);
      } catch (err) {
        // Network failure, server not running, or page opened via file://
        showError("Sorry, the book data could not be loaded. Please check your connection and make sure the page is served from a local server.");
        console.error(err);
        return;
      }

      if (!response.ok) {
        // fetch() does not reject on HTTP errors such as 404, so check response.ok
        showError(`Sorry, the book data could not be loaded (HTTP ${response.status}).`);
        return;
      }

      let data;
      try {
        data = await response.json();
      } catch (err) {
        showError("Sorry, the book data file is not valid JSON.");
        console.error(err);
        return;
      }

      const books = data.books;
      if (!Array.isArray(books) || books.length < 2) {
        showError("Sorry, the book data is missing or incomplete.");
        return;
      }

      status.remove();

      // (a) Title of the first book
      addSection("(a) Title of the first book", books[0].title);

      // (b) Author of the second book
      addSection("(b) Author of the second book", books[1].author);

      // (c) Genres of both books, grouped by title
      const genreSection = addSection("(c) Genres grouped by book", "");
      genreSection.querySelector("p").remove();
      const list = document.createElement("ul");
      for (const book of books) {
        const li = document.createElement("li");
        const title = document.createElement("strong");
        title.textContent = book.title;
        li.append(title, ` — ${book.genres.join(", ")}`);
        list.appendChild(li);
      }
      genreSection.appendChild(list);
    }

    loadBooks();
  </script>
</body>
</html>
